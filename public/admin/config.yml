backend:
  name: github
  repo: NoahtheBoah32/mycelium-site
  branch: master

media_folder: public/images/cms
public_folder: /images/cms

collections:
  - name: pages
    label: Pages
    files:
      - name: homepage
        label: Homepage
        file: src/content/data/homepage.json
        fields:
          - label: "Hero"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - label: "Images (3 side-by-side)"
                name: images
                widget: list
                field: { label: "Image", name: image, widget: image }

          - label: "Mission"
            name: mission
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Body", name: body, widget: text }

          - label: "Stats"
            name: stats
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow Label", name: eyebrow, widget: string }
              - label: "Stat Items"
                name: items
                widget: list
                fields:
                  - { label: "Number", name: number, widget: string }
                  - { label: "Label", name: label, widget: string }

          - label: "Founder Section"
            name: founder
            widget: object
            collapsed: true
            fields:
              - { label: "Photo", name: image, widget: image }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Body", name: body, widget: text }

          - label: "How We Operate"
            name: howOperate
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subtext", name: sub, widget: text }
              - label: "Columns"
                name: columns
                widget: list
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Body", name: body, widget: text }
                  - { label: "Icon Image (columns 1 & 2)", name: icon, widget: image, required: false }
                  - { label: "Partners Logo (column 3)", name: partnersImage, widget: image, required: false }
                  - { label: "Sanghiblayan Logo (column 3)", name: sanghiblayanImage, widget: image, required: false }

          - label: "Videos Section"
            name: videos
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subtext", name: sub, widget: string }

          - label: "Courses Section"
            name: courses
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subtext", name: sub, widget: string }
              - label: "Featured Courses"
                name: items
                widget: list
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Meta (e.g. All Countries · All Types)", name: meta, widget: string }
                  - { label: "URL", name: url, widget: string }
                  - { label: "Thumbnail", name: image, widget: image }

          - label: "Resources Section"
            name: resources
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subtext", name: sub, widget: string }
              - label: "Featured Resources"
                name: items
                widget: list
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Category Tag", name: category, widget: string }
                  - { label: "Description", name: description, widget: text }
                  - { label: "URL", name: url, widget: string }
                  - { label: "Thumbnail", name: image, widget: image }

          - label: "Newsletter"
            name: newsletter
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subtext", name: sub, widget: text }
              - { label: "Privacy Text", name: privacy, widget: string }

      - name: about
        label: About
        file: src/content/data/about.json
        fields:
          - label: "Hero"
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: "Background Image", name: image, widget: image }
              - { label: "Title", name: title, widget: string }

          - label: "How It Started"
            name: story
            widget: object
            collapsed: true
            fields:
              - { label: "Intro Line", name: intro, widget: text }
              - { label: "Photo", name: image, widget: image }
              - label: "Paragraphs"
                name: paragraphs
                widget: list
                field: { label: "Paragraph", name: text, widget: text }

          - label: "Why This Matters"
            name: why
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - label: "Paragraphs"
                name: paragraphs
                widget: list
                field: { label: "Paragraph", name: text, widget: text }
              - { label: "Waste Chart Image", name: chartImage, widget: image }
              - { label: "Waste Chart Caption", name: chartCaption, widget: text }
              - { label: "Landscape Photo", name: landscapeImage, widget: image }
              - { label: "Biodiversity Image", name: bioImage, widget: image }
              - { label: "Biodiversity Caption", name: bioCaption, widget: text }

          - label: "Here's the Thing"
            name: heresthething
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Left Column Paragraph", name: left, widget: text }
              - { label: "Right Column — Paragraph 1", name: right1, widget: text }
              - { label: "Right Column — Paragraph 2", name: right2, widget: text }

          - label: "Measuring Impact"
            name: impact
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - label: "Paragraphs"
                name: paragraphs
                widget: list
                field: { label: "Paragraph", name: text, widget: text }
              - label: "Photos (3 images)"
                name: images
                widget: list
                field: { label: "Photo", name: image, widget: image }

          - label: "Mission"
            name: mission
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Body", name: body, widget: text }
              - label: "Pillars"
                name: pillars
                widget: list
                fields:
                  - { label: "Label", name: label, widget: string }
                  - { label: "Body", name: body, widget: text }

          - label: "Criteria"
            name: criteria
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - label: "Items"
                name: items
                widget: list
                fields:
                  - { label: "Number", name: number, widget: string }
                  - { label: "Question", name: question, widget: string }
                  - { label: "Answer", name: answer, widget: text }

          - label: "Partners"
            name: partners
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Intro", name: intro, widget: text }
              - label: "Partner List"
                name: items
                widget: list
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Description", name: description, widget: text }
                  - { label: "Photo", name: image, widget: image }

  - name: events
    label: Events
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Event Title", name: title, widget: string }
      - label: "Card Style"
        name: template
        widget: select
        options:
          - { label: "Kapihan (green, recurring)", value: kapihan }
          - { label: "Baganihan (dark glass, one-time talk)", value: bag }
          - { label: "PDC / Course (warm peach, multi-day)", value: pdc }
      - { label: "Schedule Line", name: schedule, widget: string, required: false }
      - { label: "Event Date", name: date, widget: datetime, required: false }
      - { label: "Time", name: time, widget: string, required: false }
      - { label: "Location", name: location, widget: string, required: false }
      - { label: "Extra Detail (e.g. Free Coffee)", name: notes, widget: string, required: false }
      - { label: "Online Event", name: isOnline, widget: boolean, default: false }
      - { label: "Free Entry", name: isFree, widget: boolean, default: false }
      - { label: "Recurring Event", name: isRecurring, widget: boolean, default: false }
      - { label: "Description", name: description, widget: text, required: false }
      - { label: "Button Label", name: ctaLabel, widget: string, required: false }
      - { label: "Button URL", name: ctaUrl, widget: string, required: false }
      - { label: "Event Image (Kapihan card)", name: image, widget: image, required: false }
      - { label: "Sort Order (lower = first)", name: sortOrder, widget: number, default: 0 }
      - { label: "Speaker Name", name: speakerName, widget: string, required: false }
      - { label: "Speaker Role", name: speakerRole, widget: string, required: false }
      - { label: "Speaker Bio", name: speakerBio, widget: text, required: false }
      - { label: "Organizer Name", name: organizer, widget: string, required: false }
      - { label: "Organizer Logo", name: organizerLogo, widget: image, required: false }
      - { label: "Date Range Display (e.g. 4–10, PDC only)", name: dateRange, widget: string, required: false }
      - label: "Course Highlights (PDC only)"
        name: highlights
        widget: list
        required: false
        field: { label: "Highlight", name: text, widget: string }
