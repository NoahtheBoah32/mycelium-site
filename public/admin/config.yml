backend:
  name: github
  repo: NoahtheBoah32/mycelium-site
  branch: master

media_folder: public/images/cms
public_folder: /images/cms

collections:
  - name: pages
    label: Pages
    files:
      - name: homepage
        label: Homepage
        file: src/content/data/homepage.json
        fields:
          - { label: "Hero Heading", name: heroHeading, widget: string }
          - label: "Hero Images (3 side-by-side)"
            name: heroImages
            widget: list
            field: { label: "Image", name: image, widget: image }
          - { label: "Mission Heading", name: missionHeading, widget: string }
          - { label: "Mission Body", name: missionBody, widget: text }
          - { label: "Stats Eyebrow", name: statsEyebrow, widget: string }
          - label: "Stats"
            name: stats
            widget: list
            fields:
              - { label: "Number", name: number, widget: string }
              - { label: "Label", name: label, widget: string }
          - { label: "Founder Photo", name: founderImage, widget: image }
          - { label: "Founder Heading", name: founderHeading, widget: string }
          - { label: "Founder Body", name: founderBody, widget: text }
          - { label: "How We Operate Heading", name: howOperateHeading, widget: string }
          - { label: "How We Operate Subtext", name: howOperateSub, widget: text }
          - label: "Operate Columns"
            name: operateColumns
            widget: list
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Body", name: body, widget: text }
              - { label: "Icon Image (columns 1 & 2)", name: icon, widget: image, required: false }
              - { label: "Partners Logo (column 3 only)", name: partnersImage, widget: image, required: false }
              - { label: "Sanghiblayan Logo (column 3 only)", name: sanghiblayanImage, widget: image, required: false }
          - { label: "Videos Section Heading", name: videosHeading, widget: string }
          - { label: "Videos Section Subtext", name: videosSub, widget: string }
          - { label: "Courses Section Heading", name: coursesHeading, widget: string }
          - { label: "Courses Section Subtext", name: coursesSub, widget: string }
          - label: "Featured Courses"
            name: featuredCourses
            widget: list
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Meta (e.g. All Countries · All Types)", name: meta, widget: string }
              - { label: "URL", name: url, widget: string }
              - { label: "Thumbnail Image", name: image, widget: image }
          - { label: "Resources Section Heading", name: resourcesHeading, widget: string }
          - { label: "Resources Section Subtext", name: resourcesSub, widget: string }
          - label: "Featured Resources"
            name: featuredResources
            widget: list
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Category Tag", name: category, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "URL", name: url, widget: string }
              - { label: "Thumbnail Image", name: image, widget: image }
          - { label: "Newsletter Heading", name: newsletterHeading, widget: string }
          - { label: "Newsletter Subtext", name: newsletterSub, widget: text }
          - { label: "Newsletter Privacy Text", name: newsletterPrivacy, widget: string }

      - name: about
        label: About
        file: src/content/data/about.json
        fields:
          - { label: "Hero Background Image", name: heroImage, widget: image }
          - { label: "Hero Title", name: heroTitle, widget: string }
          - { label: "Story Intro", name: storyIntro, widget: text }
          - { label: "Story Photo", name: storyImage, widget: image }
          - label: "Story Paragraphs"
            name: storyParagraphs
            widget: list
            field: { label: "Paragraph", name: text, widget: text }
          - { label: "Why This Matters Heading", name: whyHeading, widget: string }
          - label: "Why Paragraphs"
            name: whyParagraphs
            widget: list
            field: { label: "Paragraph", name: text, widget: text }
          - { label: "Waste Chart Image", name: whyChartImage, widget: image }
          - { label: "Waste Chart Caption", name: whyChartCaption, widget: text }
          - { label: "Landscape Photo", name: whyLandscapeImage, widget: image }
          - { label: "Biodiversity Card Image", name: whyBioImage, widget: image }
          - { label: "Biodiversity Caption", name: whyBioCaption, widget: text }
          - { label: "Here's the Thing Heading", name: heresthethingHeading, widget: string }
          - { label: "Here's the Thing (left column)", name: heresthethingLeft, widget: text }
          - { label: "Here's the Thing (right, paragraph 1)", name: heresthethingRight1, widget: text }
          - { label: "Here's the Thing (right, paragraph 2)", name: heresthethingRight2, widget: text }
          - { label: "Impact Heading", name: impactHeading, widget: string }
          - label: "Impact Paragraphs"
            name: impactParagraphs
            widget: list
            field: { label: "Paragraph", name: text, widget: text }
          - label: "Impact Photos (3 images)"
            name: impactImages
            widget: list
            field: { label: "Photo", name: image, widget: image }
          - { label: "Mission Eyebrow", name: missionEyebrow, widget: string }
          - { label: "Mission Heading", name: missionHeading, widget: string }
          - { label: "Mission Body", name: missionBody, widget: text }
          - label: "Mission Pillars"
            name: missionPillars
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "Body", name: body, widget: text }
          - { label: "Criteria Eyebrow", name: criteriaEyebrow, widget: string }
          - { label: "Criteria Heading", name: criteriaHeading, widget: string }
          - label: "Criteria Items"
            name: criteriaItems
            widget: list
            fields:
              - { label: "Number", name: number, widget: string }
              - { label: "Question", name: question, widget: string }
              - { label: "Answer", name: answer, widget: text }
          - { label: "Partners Eyebrow", name: partnersEyebrow, widget: string }
          - { label: "Partners Heading", name: partnersHeading, widget: string }
          - { label: "Partners Intro", name: partnersIntro, widget: text }
          - label: "Partners"
            name: partners
            widget: list
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Photo", name: image, widget: image }

  - name: events
    label: Events
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Event Title", name: title, widget: string }
      - label: "Card Style"
        name: template
        widget: select
        options:
          - { label: "Kapihan (green, recurring)", value: kapihan }
          - { label: "Baganihan (dark glass, one-time talk)", value: bag }
      - { label: "Schedule Line", name: schedule, widget: string, required: false }
      - { label: "Event Date", name: date, widget: datetime, required: false }
      - { label: "Time", name: time, widget: string, required: false }
      - { label: "Location", name: location, widget: string, required: false }
      - { label: "Extra Detail (e.g. Free Coffee)", name: notes, widget: string, required: false }
      - { label: "Online Event", name: isOnline, widget: boolean, default: false }
      - { label: "Free Entry", name: isFree, widget: boolean, default: false }
      - { label: "Recurring Event", name: isRecurring, widget: boolean, default: false }
      - { label: "Description", name: description, widget: text, required: false }
      - { label: "Button Label", name: ctaLabel, widget: string, required: false }
      - { label: "Button URL", name: ctaUrl, widget: string, required: false }
      - { label: "Event Image (Kapihan card)", name: image, widget: image, required: false }
      - { label: "Sort Order (lower = first)", name: sortOrder, widget: number, default: 0 }
      - { label: "Speaker Name", name: speakerName, widget: string, required: false }
      - { label: "Speaker Role", name: speakerRole, widget: string, required: false }
      - { label: "Speaker Bio", name: speakerBio, widget: text, required: false }
      - { label: "Organizer Name", name: organizer, widget: string, required: false }
      - { label: "Organizer Logo", name: organizerLogo, widget: image, required: false }
