name: Fix Broken Thumbnails

on:
  workflow_dispatch:

jobs:
  fix-thumbs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Fix thumbnails for broken reels
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/fix-thumbs.mjs
      - name: Commit updated thumbnails
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/reels/
          git diff --cached --quiet || git commit -m "fix: thumbnails for 6 broken reels [skip ci]"
          git push
